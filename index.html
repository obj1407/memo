<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>캘린더 메모</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>" />
<script>
  (function loadMqtt(sources) {
    if (!sources.length) { window.__mqttFailed = true; return; }
    const s = document.createElement('script');
    s.src = sources[0];
    s.onload = () => { window.__mqttLoaded = true; console.log('MQTT 로드 성공:', sources[0]); };
    s.onerror = () => { s.remove(); loadMqtt(sources.slice(1)); };
    document.head.appendChild(s);
  })([
    'https://cdn.jsdelivr.net/npm/mqtt@5.10.4/dist/mqtt.min.js',
    'https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js',
    'https://unpkg.com/mqtt/dist/mqtt.min.js'
  ]);
</script>
<style>
  :root{
    --bg:#0f1216; --header-bg:#262b33; --cell-bg:#12161b; --cell-hover:#1a1f26;
    --border:#242a31; --text:#d7dce2; --dim:#5c6670; --red:#e5484d; --blue:#58a6ff;
    --green:#3fb950; --purple:#b392f0; --yellow:#ffd166;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:auto;}

  .topbar{display:flex;align-items:center;gap:8px;padding:10px 20px;background:#171b21;border-bottom:1px solid var(--border);flex:0 0 auto;flex-wrap:wrap;}
  .topbar button{background:#232930;border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;}
  .topbar button:hover{background:#2d343c;}
  .topbar select,.topbar input{background:#232930;border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:6px;font-size:13px;outline:none;color-scheme:dark;}
  .topbar .lbl{font-size:13px;color:var(--dim);}
  .share{display:flex;align-items:center;gap:6px;margin-left:12px;padding-left:12px;border-left:1px solid var(--border);}
  .dot{width:10px;height:10px;border-radius:50%;background:#5c6670;}
  .dot.on{background:var(--green);box-shadow:0 0 6px var(--green);}
  .user-badge{font-size:12px;color:var(--blue);background:#12161b;border:1px solid var(--border);border-radius:6px;padding:5px 10px;}
  .storage{font-size:12px;color:var(--dim);margin-left:10px;padding-left:12px;border-left:1px solid var(--border);cursor:pointer;}
  .storage.mid{color:var(--yellow);}
  .storage.warn{color:var(--red);font-weight:600;}
  .ticker{flex:1;min-width:200px;margin-left:12px;height:34px;display:flex;align-items:center;justify-content:center;gap:8px;
          background:#12161b;border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 14px;}
  .ticker .star{color:var(--red);}
  .ticker .date{color:var(--blue);}
  .ticker .dim{color:var(--dim);font-size:12px;}
  .ticker b{color:#ffd8d8;font-weight:600;}

  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);background:var(--header-bg);border-bottom:1px solid var(--border);flex:0 0 auto;user-select:none;}
  .weekdays div{height:42px;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .weekdays .sun{color:var(--red);} .weekdays .sat{color:var(--blue);}

  .grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(120px,1fr);min-height:0;}
  .cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--cell-bg);
        padding:8px 10px;cursor:pointer;position:relative;overflow:hidden;user-select:none;}
  .cell:nth-child(7n){border-right:none;}
  .cell:hover{background:var(--cell-hover);}
  .cell .day{font-size:15px;font-weight:600;}
  .cell.sun .day{color:var(--red);} .cell.sat .day{color:var(--blue);}
  .cell.other .day{color:var(--dim);}
  .cell.holiday .day{color:var(--red);}
  .cell.today{background:#1c2229;box-shadow:inset 0 0 0 1px var(--blue);}
  .holiday{color:var(--red);font-size:11px;font-weight:600;margin-top:2px;}
  .count{position:absolute;top:8px;right:10px;font-size:12px;color:var(--blue);}
  .memos{margin-top:6px;display:flex;flex-direction:column;gap:4px;}
  .memo-line{font-size:11.5px;color:#9aa4af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
             border-left:2px solid #3a414a;padding-left:6px;}
  .memo-line.imp{color:#ff8787;border-left-color:var(--red);}
  .memo-line.priv{color:var(--purple);border-left-color:#7e57c2;}
  .more{font-size:11px;color:var(--dim);padding-left:6px;margin-top:2px;}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:10;}
  .modal.hidden{display:none;}
  .modal-box{width:540px;max-width:92vw;background:#1b2027;border:1px solid #333a43;border-radius:10px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
  .modal-box h2{font-size:16px;margin-bottom:14px;}
  .input-row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;}
  .input-row textarea{flex:1;min-width:180px;min-height:70px;resize:vertical;background:#12161b;border:1px solid #333a43;
                      border-radius:6px;color:var(--text);padding:9px 11px;font-size:13px;outline:none;font-family:inherit;line-height:1.5;}
  .input-row textarea:focus{border-color:var(--blue);}
  .chk{display:flex;align-items:center;gap:5px;font-size:13px;color:#ff8787;cursor:pointer;user-select:none;}
  .chk.priv{color:var(--purple);}
  .chk.alarm{color:var(--yellow);}
  .chk input{accent-color:currentColor;width:15px;height:15px;cursor:pointer;}
  .input-row button{background:var(--blue);border:none;color:#fff;border-radius:6px;padding:9px 16px;cursor:pointer;font-size:13px;align-self:flex-end;}
  #cancelEditBtn{background:#232930;border:1px solid #333a43 !important;color:var(--text) !important;}
  .opt-row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;font-size:13px;}
  .opt-row .lbl{color:var(--dim);}
  .opt-row input[type=number]{background:#232930;border:1px solid #333a43;color:var(--text);padding:4px 6px;border-radius:6px;font-size:12px;outline:none;width:55px;}
  .opt-row input[type=time]{background:#232930;border:1px solid #333a43;color:var(--text);padding:4px 6px;border-radius:6px;font-size:12px;outline:none;color-scheme:dark;}

  .img-upload{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .img-upload .up-btn{background:#232930;border:1px solid #333a43;color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;}
  .img-upload .up-btn:hover{background:#2d343c;}
  .img-upload .help{font-size:11px;color:var(--dim);}
  .img-preview{margin-top:8px;position:relative;display:inline-block;max-width:100%;}
  .img-preview img{max-width:100%;max-height:180px;border-radius:6px;border:1px solid #333a43;cursor:zoom-in;}
  .img-preview .rm{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:13px;}

  .memo-list{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto;}
  .memo-list li{display:flex;align-items:center;gap:6px;background:#232930;border:1px solid #333a43;border-radius:6px;padding:8px 10px;font-size:13px;}
  .memo-list li .star-btn,.memo-list li .lock-btn{background:transparent;border:none;cursor:pointer;font-size:15px;color:#5c6670;padding:0 2px;}
  .memo-list li .star-btn.on{color:var(--red);}
  .memo-list li .lock-btn.on{color:var(--purple);}
  .memo-list li .thumb{width:30px;height:30px;border-radius:4px;object-fit:cover;border:1px solid #333a43;cursor:zoom-in;}
  .memo-list li .txt{flex:1;word-break:break-all;}
  .memo-list li .txt.imp{color:#ff8787;}
  .memo-list li .txt.priv{color:var(--purple);}
  .memo-list li .act{background:transparent;border:none;color:var(--blue);cursor:pointer;font-size:12px;}
  .memo-list li .del{background:transparent;border:none;color:var(--red);cursor:pointer;font-size:12px;}
  .empty{color:var(--dim);font-size:12px;margin-top:12px;text-align:center;}
  .close-row{margin-top:16px;text-align:right;}
  .close-row button{background:#232930;border:1px solid #333a43;color:var(--text);padding:6px 14px;border-radius:6px;cursor:pointer;}

  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:30;cursor:zoom-out;}
  .lightbox.hidden{display:none;}
  .lightbox img{max-width:94vw;max-height:94vh;border-radius:8px;box-shadow:0 0 40px rgba(0,0,0,.8);}

  .saved-box{width:420px;max-width:92vw;background:#1b2027;border:1px solid #333a43;border-radius:10px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
  .saved-box h2{font-size:16px;color:var(--green);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .saved-info{background:#12161b;border:1px solid #333a43;border-radius:8px;padding:14px;}
  .saved-info .date{color:var(--blue);font-size:13px;margin-bottom:8px;}
  .saved-info .text{font-size:14px;line-height:1.6;color:var(--text);word-break:break-all;}
  .saved-info .meta{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--dim);}
  .saved-info .meta span{background:#232930;padding:3px 8px;border-radius:4px;}
  .saved-info .meta .red{color:#ff8787;}
  .saved-info .meta .pur{color:var(--purple);}
  .saved-info .meta .yel{color:var(--yellow);}
  .saved-info img{margin-top:10px;max-width:100%;max-height:240px;border-radius:6px;border:1px solid #333a43;display:block;cursor:zoom-in;}

  .week-body{max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:12px;margin-top:6px;}
  .week-day h3{font-size:13px;color:var(--blue);margin-bottom:5px;}
  .week-day h3.sun{color:var(--red);}
  .week-day h3 .today-tag{color:var(--green);font-size:11px;margin-left:6px;}
  .week-day h3 .hol{color:var(--red);font-size:11px;margin-left:6px;}
  .week-day ul{list-style:none;display:flex;flex-direction:column;gap:4px;}
  .week-day li{font-size:12.5px;color:#9aa4af;padding-left:8px;border-left:2px solid #3a414a;}
  .week-day li.imp{color:#ff8787;border-left-color:var(--red);}
  .week-day li.priv{color:var(--purple);border-left-color:#7e57c2;}

  .cleanup-box{width:560px;max-width:92vw;background:#1b2027;border:1px solid #333a43;border-radius:10px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.6);}
  .cleanup-box h2{font-size:16px;color:var(--red);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .cleanup-box h2.ok{color:var(--green);}
  .cleanup-box .desc{font-size:12px;color:var(--dim);margin-bottom:14px;line-height:1.6;}
  .cleanup-box .desc b{color:var(--yellow);}
  .cleanup-box .desc b.good{color:var(--green);}
  .cleanup-list{list-style:none;max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:8px;}
  .cleanup-item{display:flex;align-items:center;gap:10px;background:#232930;border:1px solid #333a43;border-radius:8px;padding:10px;}
  .cleanup-item .thumb{width:70px;height:70px;border-radius:6px;object-fit:cover;border:1px solid #333a43;cursor:zoom-in;flex-shrink:0;}
  .cleanup-item .info{flex:1;min-width:0;}
  .cleanup-item .info .d{font-size:12px;color:var(--blue);margin-bottom:3px;}
  .cleanup-item .info .t{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cleanup-item .info .sz{font-size:11px;color:var(--dim);margin-top:3px;}
  .cleanup-item .del{background:var(--red);border:none;color:#fff;border-radius:6px;padding:7px 12px;cursor:pointer;font-size:12px;font-weight:600;}
  .cleanup-item .del:hover{background:#c8363b;}

  .login-wrap{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;}
  .login-box{width:380px;max-width:92vw;background:#1b2027;border:1px solid #333a43;border-radius:12px;padding:30px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
  .login-box h1{font-size:20px;text-align:center;margin-bottom:22px;}
  .login-box .field{margin-bottom:12px;}
  .login-box .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px;}
  .login-box .field input,.login-box .field select{width:100%;background:#12161b;border:1px solid #333a43;border-radius:6px;color:var(--text);padding:10px 12px;font-size:14px;outline:none;}
  .login-box .field input:focus{border-color:var(--blue);}
  .login-box #loginBtn{width:100%;margin-top:8px;background:var(--blue);border:none;color:#fff;border-radius:6px;padding:11px;cursor:pointer;font-size:14px;font-weight:600;}
  .login-box #loginBtn:disabled{opacity:0.6;cursor:wait;}
  .sync-indicator{font-size:11px;color:var(--green);text-align:center;margin-top:8px;min-height:14px;}
  .login-box .hint{margin-top:10px;font-size:11px;color:var(--dim);line-height:1.6;text-align:center;}
  .login-box .hint b{color:var(--blue);}

  .acct-create{display:flex;gap:8px;flex-wrap:wrap;}
  .acct-create input{flex:1;min-width:100px;background:#12161b;border:1px solid #333a43;border-radius:6px;color:var(--text);padding:8px 10px;font-size:13px;outline:none;}
  .acct-create button{background:var(--green);border:none;color:#fff;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:13px;}
  .acct-list{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto;}
  .acct-list li{display:flex;align-items:center;gap:8px;background:#232930;border:1px solid #333a43;border-radius:6px;padding:9px 12px;font-size:13px;}
  .acct-list li .aid{flex:1;font-weight:600;}
  .acct-list li .aid.admin{color:var(--yellow);}
  .acct-list li .apw{color:var(--dim);font-size:12px;letter-spacing:1px;}
  .acct-list li button{background:transparent;border:none;cursor:pointer;font-size:12px;padding:0 3px;}
  .acct-list li .eye{color:var(--dim);}
  .acct-list li .mod{color:var(--blue);}
  .acct-list li .del{color:var(--red);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#232930;border:1px solid #444c56;
         color:var(--text);padding:10px 20px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.4);
         opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}
  .toast.ok{border-color:var(--green);}
  .toast.err{border-color:var(--red);}

  @media (max-width: 768px) {
    .topbar { padding: 8px 10px; gap: 6px; justify-content: center; }
    .share { margin-left: 0; padding-left: 0; border-left: none; margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; width: 100%; justify-content: center; }
    .storage { margin-left: 0; padding-left: 0; border-left: none; width: 100%; text-align: center; }
    .ticker { width: 100%; margin-left: 0; margin-top: 8px; flex: auto; }
    .weekdays div { height: 30px; font-size: 12px; }
    .grid { grid-auto-rows: minmax(80px, 1fr); }
    .cell { padding: 4px; }
    .cell .day { font-size: 13px; }
    .holiday { font-size: 9px; margin-top: 0; }
    .count { font-size: 10px; top: 4px; right: 4px; }
    .memos { display: none; }
    .cleanup-item .thumb { width: 55px; height: 55px; }
  }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <h1>📅 캘린더 메모 로그인</h1>
    <div class="field"><label>팀 코드</label><input id="teamInput" value="our-team" /></div>
    <div class="field"><label>아이디</label><input id="idInput" autocomplete="username" /></div>
    <div class="field"><label>비밀번호 (숫자만)</label><input id="pwInput" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password" /></div>
    <div class="field"><label>미사용 시 자동 로그아웃</label>
      <select id="logoutSel">
        <option value="5">5분</option>
        <option value="10" selected>10분</option>
        <option value="60">1시간</option>
        <option value="0">끄기</option>
      </select>
    </div>
    <button id="loginBtn">로그인</button>
    <div class="sync-indicator" id="syncIndicator"></div>
    <div class="hint">비밀번호는 숫자 4~8자리 · 계정 관리는 관리자만 가능<br>
      팀 코드가 같아야 공유됩니다 · 앱 버전 <b>v2.1</b></div>
  </div>
</div>

<div class="topbar">
  <button id="prevBtn">‹</button>
  <select id="yearSel"></select><span class="lbl">년</span>
  <select id="monthSel"></select><span class="lbl">월</span>
  <button id="nextBtn">›</button>
  <button id="todayBtn">오늘</button>
  <button id="weekBtn" title="이번 주 메모 요약">📋 주간</button>
  <button id="refreshBtn" title="새로고침">🔄</button>
  <button id="exportBtn" title="백업 파일 내보내기">📤</button>
  <button id="importBtn" title="백업 파일 가져오기">📥</button>
  <input type="file" id="importFile" accept=".json,application/json" style="display:none" />
  <input type="date" id="dateJump" />
  <button id="jumpBtn">이동</button>
  <span class="share" title="실시간 공유 상태">
    <span id="shareStatus" class="dot"></span><span class="lbl">실시간 공유</span>
    <button id="bellBtn" title="알람 켜기/끄기">🔔</button>
  </span>
  <span class="user-badge" id="userBadge"></span>
  <button id="acctBtn" style="display:none;">👥 계정</button>
  <button id="logoutBtn" title="로그아웃">🚪</button>
  <span class="storage" id="storageInfo" title="클릭 시 사진 정리 팝업 열기"></span>
  <div class="ticker" id="ticker" title="더블클릭 시 해당 날짜로 이동"></div>
</div>

<div class="weekdays">
  <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div>
</div>

<div class="grid" id="grid"></div>

<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modalTitle"></h2>
    <div class="input-row">
      <textarea id="memoInput" placeholder="메모를 입력하세요 (Enter: 저장, Shift+Enter: 줄바꿈)" maxlength="500"></textarea>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <button id="addBtn">추가</button>
        <button id="cancelEditBtn" style="display:none;">취소</button>
      </div>
    </div>
    <div class="opt-row">
      <span class="lbl">시간</span><input type="time" id="timeInput" title="메모 시간(미입력 시 09:00)" />
      <label class="chk"><input type="checkbox" id="impChk" />중요</label>
      <label class="chk priv"><input type="checkbox" id="privChk" />🔒 개인</label>
    </div>
    <div class="opt-row">
      <label class="chk alarm"><input type="checkbox" id="alarmDayChk" />하루 전 알람</label>
      <label class="chk alarm"><input type="checkbox" id="alarmTimeChk" />시간 전 알람</label>
      <input type="number" id="alarmH" min="0" max="720" value="1" /> <span class="lbl">시간</span>
      <input type="number" id="alarmM" min="0" max="59" value="0" /> <span class="lbl">분 전</span>
    </div>
    <div class="img-upload">
      <label class="up-btn">📷 사진 첨부<input type="file" id="imgFile" accept="image/*" style="display:none" /></label>
      <span class="help">자동 압축(640px) 후 실시간 공유됩니다</span>
    </div>
    <div class="img-preview hidden" id="imgPreview">
      <img id="imgThumb" />
      <button class="rm" id="imgRemoveBtn" title="사진 삭제">✕</button>
    </div>
    <ul class="memo-list" id="memoList"></ul>
    <div class="close-row"><button id="closeBtn">닫기</button></div>
  </div>
</div>

<div class="modal hidden" id="savedModal">
  <div class="saved-box">
    <h2>✅ 메모가 저장되었습니다</h2>
    <div class="saved-info" id="savedInfo"></div>
    <div class="close-row"><button id="savedCloseBtn">확인</button></div>
  </div>
</div>

<div class="modal hidden" id="weekModal">
  <div class="modal-box">
    <h2 id="weekTitle"></h2>
    <div id="weekBody" class="week-body"></div>
    <div class="close-row"><button id="weekCloseBtn">닫기</button></div>
  </div>
</div>

<div class="modal hidden" id="acctModal">
  <div class="modal-box">
    <h2>👥 계정 관리 (관리자 전용)</h2>
    <div class="acct-create">
      <input id="newId" placeholder="새 아이디 (영문/숫자 3~20자)" maxlength="20" />
      <input id="newPw" type="password" inputmode="numeric" maxlength="8" placeholder="비밀번호 (숫자 4~8자)" />
      <button id="createBtn">생성</button>
    </div>
    <ul class="acct-list" id="acctList"></ul>
    <div class="close-row"><button id="acctCloseBtn">닫기</button></div>
  </div>
</div>

<div class="modal hidden" id="cleanupModal">
  <div class="cleanup-box">
    <h2 id="cleanupTitle">⚠️ 저장소 용량이 부족합니다</h2>
    <div class="desc" id="cleanupDesc"></div>
    <ul class="cleanup-list" id="cleanupList"></ul>
    <div class="close-row"><button id="cleanupCloseBtn">나중에</button></div>
  </div>
</div>

<div class="lightbox hidden" id="lightbox"><img id="lightboxImg" /></div>

<div class="toast" id="toast"></div>

<script>
  const APP_VER = '2.1';
  console.log('캘린더 메모 v' + APP_VER);

  const $ = s => document.querySelector(s);
  const grid = $('#grid'), ticker = $('#ticker');
  const loginWrap = $('#loginWrap'), teamInput = $('#teamInput'), idInput = $('#idInput'),
        pwInput = $('#pwInput'), logoutSel = $('#logoutSel'), loginBtn = $('#loginBtn'),
        syncIndicator = $('#syncIndicator'),
        userBadge = $('#userBadge'), acctBtn = $('#acctBtn'), logoutBtn = $('#logoutBtn'),
        acctModal = $('#acctModal'), acctList = $('#acctList'),
        newId = $('#newId'), newPw = $('#newPw'),
        exportBtn = $('#exportBtn'), importBtn = $('#importBtn'), importFile = $('#importFile'),
        modal = $('#modal'), modalTitle = $('#modalTitle'),
        memoInput = $('#memoInput'), memoList = $('#memoList'),
        impChk = $('#impChk'), privChk = $('#privChk'),
        timeInput = $('#timeInput'), alarmDayChk = $('#alarmDayChk'),
        alarmTimeChk = $('#alarmTimeChk'), alarmH = $('#alarmH'), alarmM = $('#alarmM'),
        addBtn = $('#addBtn'), cancelEditBtn = $('#cancelEditBtn'),
        yearSel = $('#yearSel'), monthSel = $('#monthSel'), dateJump = $('#dateJump'),
        shareStatus = $('#shareStatus'), bellBtn = $('#bellBtn'),
        imgFile = $('#imgFile'), imgPreview = $('#imgPreview'),
        imgThumb = $('#imgThumb'), imgRemoveBtn = $('#imgRemoveBtn'),
        savedModal = $('#savedModal'), savedInfo = $('#savedInfo'),
        weekModal = $('#weekModal'), weekTitle = $('#weekTitle'), weekBody = $('#weekBody'),
        cleanupModal = $('#cleanupModal'), cleanupList = $('#cleanupList'),
        cleanupTitle = $('#cleanupTitle'), cleanupDesc = $('#cleanupDesc'),
        lightbox = $('#lightbox'), lightboxImg = $('#lightboxImg'),
        storageInfo = $('#storageInfo'),
        toast = $('#toast');

  const now = new Date();
  let view = { y: now.getFullYear(), m: now.getMonth() };
  let selectedKey = null, editingIdx = null;
  let impList = [], impIdx = 0;
  let currentImage = '';
  let TEAM = null, session = null, accounts = {};
  let cleanupManuallyOpened = false;
  const ADMIN = 'obj1407';
  const DAY_NAMES = ['일','월','화','수','목','금','토'];

  const pad = n => String(n).padStart(2, '0');
  const keyOf = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const countAll = obj => Object.values(obj).reduce((s, a) => s + a.length, 0);
  const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const validPw = pw => /^\d{4,8}$/.test(pw);
  const validId = id => /^[a-zA-Z0-9_]{3,20}$/.test(id);
  const memKey = () => 'calMemos_' + TEAM;
  const accKey = () => 'accounts_' + TEAM;

  function showToast(msg, type='') {
    toast.textContent = msg;
    toast.className = 'toast show ' + type;
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { toast.className = 'toast'; }, 2500);
  }

  /* ---------- 저장소 ---------- */
  const QUOTA = 5 * 1024 * 1024;
  function updateStorage() {
    const json = localStorage.getItem(memKey()) || '';
    const used = json.length * 2;
    const pct = Math.min(100, (used / QUOTA) * 100);
    const remainMB = Math.max(0, (QUOTA - used) / 1048576);
    storageInfo.textContent = `💾 ${pct.toFixed(1)}% 사용 · ${remainMB.toFixed(1)}MB 남음`;
    storageInfo.className = 'storage' + (pct > 80 ? ' warn' : (pct > 50 ? ' mid' : ''));
    if (pct >= 80 && session && !cleanupManuallyOpened && cleanupModal.classList.contains('hidden')) openCleanup();
    if (pct < 80) {
      cleanupManuallyOpened = false;
      if (!cleanupModal.classList.contains('hidden')) {
        cleanupModal.classList.add('hidden');
        showToast('✓ 저장소 용량이 충분합니다.', 'ok');
      }
    }
    if (!cleanupModal.classList.contains('hidden')) renderCleanupList();
  }
  function openCleanup() {
    if (!session) return;
    renderCleanupList();
    cleanupModal.classList.remove('hidden');
  }
  function renderCleanupList() {
    const json = localStorage.getItem(memKey()) || '';
    const used = json.length * 2;
    const pct = Math.min(100, (used / QUOTA) * 100);
    if (pct >= 80) {
      cleanupTitle.textContent = '⚠️ 저장소 용량이 부족합니다';
      cleanupTitle.classList.remove('ok');
      cleanupDesc.innerHTML = `현재 저장소가 <b>${pct.toFixed(1)}%</b> 사용 중입니다.<br>아래 사진들을 삭제하여 공간을 확보하세요. <b>텍스트 메모는 유지</b>됩니다.`;
    } else {
      cleanupTitle.textContent = '✅ 저장소 용량이 충분합니다';
      cleanupTitle.classList.add('ok');
      cleanupDesc.innerHTML = `현재 저장소가 <b class="good">${pct.toFixed(1)}%</b> 사용 중으로 여유 공간이 충분합니다.<br>필요하면 오래된 사진부터 정리할 수 있습니다. <b>텍스트 메모는 유지</b>됩니다.`;
    }
    const items = [];
    Object.entries(memos).forEach(([k, list]) => {
      list.forEach(m => {
        if (m.image) items.push({ key: k, id: m.id, memo: m, sizeBytes: Math.round(m.image.length * 0.75), date: k });
      });
    });
    items.sort((a, b) => a.date.localeCompare(b.date) || (b.sizeBytes - a.sizeBytes));
    cleanupList.innerHTML = '';
    if (!items.length) { cleanupList.innerHTML = '<div class="empty">삭제할 사진이 없습니다.</div>'; return; }
    items.forEach(it => {
      const li = document.createElement('li');
      li.className = 'cleanup-item';
      const [y, mo, d] = it.key.split('-').map(Number);
      const dayName = DAY_NAMES[new Date(y, mo - 1, d).getDay()];
      const sizeStr = it.sizeBytes >= 1024 ? (it.sizeBytes / 1024).toFixed(1) + ' KB' : it.sizeBytes + ' B';
      const shortText = it.memo.text.length > 30 ? it.memo.text.slice(0, 30) + '…' : it.memo.text;
      li.innerHTML = `
        <img class="thumb" src="${it.memo.image}" />
        <div class="info">
          <div class="d">${y}.${pad(mo)}.${pad(d)} (${dayName})</div>
          <div class="t">${esc(shortText)}</div>
          <div class="sz">📷 ${sizeStr}</div>
        </div>
        <button class="del">🗑 삭제</button>`;
      li.querySelector('.thumb').onclick = () => openLightbox(it.memo.image);
      li.querySelector('.del').onclick = () => {
        if (!confirm('이 사진만 삭제하시겠습니까?\n(텍스트 메모는 유지됩니다)')) return;
        deleteImageFromMemo(it.key, it.id);
      };
      cleanupList.appendChild(li);
    });
  }
  function deleteImageFromMemo(key, id) {
    const m = (memos[key] || []).find(x => x.id === id);
    if (m) {
      m.image = '';
      save(); render();
      if (selectedKey === key && editingIdx === null) renderList();
      buildImportant();
      publishMemos();
      showToast('🗑 사진이 삭제되었습니다.', 'ok');
    }
  }
  $('#cleanupCloseBtn').onclick = () => { cleanupModal.classList.add('hidden'); cleanupManuallyOpened = true; };
  cleanupModal.addEventListener('click', e => {
    if (e.target === cleanupModal) { cleanupModal.classList.add('hidden'); cleanupManuallyOpened = true; }
  });
  storageInfo.onclick = () => { if (session) openCleanup(); };

  /* ---------- 사진 첨부 ---------- */
  imgFile.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    if (!f.type.startsWith('image/')) { alert('이미지 파일(JPG/PNG 등)만 업로드 가능합니다.'); imgFile.value = ''; return; }
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const MAX = 640;
        let { width, height } = img;
        if (width > MAX || height > MAX) {
          if (width > height) { height = Math.round(height * MAX / width); width = MAX; }
          else { width = Math.round(width * MAX / height); height = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        currentImage = canvas.toDataURL('image/jpeg', 0.7);
        imgThumb.src = currentImage;
        imgPreview.classList.remove('hidden');
        showToast('📷 사진이 첨부되었습니다.', 'ok');
      };
      img.onerror = () => alert('이미지를 불러올 수 없습니다. 다른 파일로 시도해 주세요.');
      img.src = ev.target.result;
    };
    reader.onerror = () => alert('파일을 읽을 수 없습니다.');
    reader.readAsDataURL(f);
    imgFile.value = '';
  };
  imgRemoveBtn.onclick = () => { currentImage = ''; imgThumb.src = ''; imgPreview.classList.add('hidden'); };
  imgThumb.onclick = () => { if (currentImage) openLightbox(currentImage); };

  /* ---------- 뒤로가기 ---------- */
  function anyModalOpen() {
    return !modal.classList.contains('hidden') || !savedModal.classList.contains('hidden') ||
           !weekModal.classList.contains('hidden') || !acctModal.classList.contains('hidden') ||
           !cleanupModal.classList.contains('hidden') || !lightbox.classList.contains('hidden');
  }
  function closeTopModal() {
    if (!lightbox.classList.contains('hidden')) { lightbox.classList.add('hidden'); lightboxImg.src = ''; }
    else if (!cleanupModal.classList.contains('hidden')) { cleanupModal.classList.add('hidden'); cleanupManuallyOpened = true; }
    else if (!savedModal.classList.contains('hidden')) savedModal.classList.add('hidden');
    else if (!acctModal.classList.contains('hidden')) acctModal.classList.add('hidden');
    else if (!modal.classList.contains('hidden')) closeModal();
    else if (!weekModal.classList.contains('hidden')) weekModal.classList.add('hidden');
  }
  history.pushState(null, '', location.href);
  window.addEventListener('popstate', () => {
    if (loginWrap.style.display !== 'none' && loginWrap.style.display !== '') {
      if (confirm('종료하시겠습니까?')) { window.close(); history.back(); }
      else history.pushState(null, '', location.href);
      return;
    }
    if (anyModalOpen()) { closeTopModal(); history.pushState(null, '', location.href); }
    else {
      if (confirm('종료하시겠습니까?')) { window.close(); history.back(); }
      else history.pushState(null, '', location.href);
    }
  });

  function openLightbox(src) { lightboxImg.src = src; lightbox.classList.remove('hidden'); }
  lightbox.onclick = () => { lightbox.classList.add('hidden'); lightboxImg.src = ''; };

  /* ---------- 알람 소리 ---------- */
  let alarmOn = localStorage.getItem('alarmOn') !== '0';
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; } }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return true;
  }
  function beep(freq, dur) {
    if (!ensureAudio()) return;
    try {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = freq; o.type = 'sine'; g.gain.value = 0.08;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  function updateBell() { bellBtn.textContent = alarmOn ? '🔔' : '🔕'; }
  function notify(msg) {
    showToast(msg, 'ok');
    if (!alarmOn) return;
    beep(880, .12); setTimeout(() => beep(1174, .18), 140);
    if ('Notification' in window && Notification.permission === 'granted') new Notification('캘린더 메모', { body: msg });
  }
  bellBtn.onclick = async () => {
    ensureAudio();
    alarmOn = !alarmOn;
    localStorage.setItem('alarmOn', alarmOn ? '1' : '0');
    updateBell();
    if (alarmOn) {
      if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission();
      beep(880, .15);
      notify('알람이 켜졌습니다.');
    } else showToast('알람이 꺼졌습니다.');
  };
  document.addEventListener('click', ensureAudio, { passive: true });
  document.addEventListener('touchstart', ensureAudio, { passive: true });
  document.addEventListener('keydown', ensureAudio, { passive: true });

  /* ---------- 공휴일 ---------- */
  const FIXED_HOLIDAYS = {'01-01':'신정','03-01':'삼일절','05-05':'어린이날','06-06':'현충일',
                          '08-15':'광복절','10-03':'개천절','10-09':'한글날','12-25':'성탄절'};
  const LUNAR_HOLIDAYS = {
    2020:{'01-24':'설날','01-25':'설날','01-26':'설날','04-30':'부처님오신날','09-30':'추석','10-01':'추석','10-02':'추석'},
    2021:{'02-11':'설날','02-12':'설날','02-13':'설날','05-19':'부처님오신날','09-20':'추석','09-21':'추석','09-22':'추석'},
    2022:{'01-31':'설날','02-01':'설날','02-02':'설날','05-08':'부처님오신날','09-09':'추석','09-10':'추석','09-11':'추석'},
    2023:{'01-21':'설날','01-22':'설날','01-23':'설날','05-27':'부처님오신날','09-27':'추석','09-28':'추석','09-29':'추석'},
    2024:{'02-09':'설날','02-10':'설날','02-11':'설날','05-15':'부처님오신날','09-16':'추석','09-17':'추석','09-18':'추석'},
    2025:{'01-28':'설날','01-29':'설날','01-30':'설날','10-05':'추석','10-06':'추석','10-07':'추석'},
    2026:{'02-16':'설날','02-17':'설날','02-18':'설날','05-24':'부처님오신날','09-24':'추석','09-25':'추석','09-26':'추석'},
    2027:{'02-05':'설날','02-06':'설날','02-07':'설날','05-13':'부처님오신날','09-14':'추석','09-15':'추석','09-16':'추석'},
    2028:{'01-26':'설날','01-27':'설날','01-28':'설날','05-02':'부처님오신날','10-02':'추석','10-03':'추석','10-04':'추석'},
    2029:{'02-12':'설날','02-13':'설날','02-14':'설날','05-20':'부처님오신날','09-21':'추석','09-22':'추석','09-23':'추석'},
    2030:{'02-01':'설날','02-02':'설날','02-03':'설날','05-09':'부처님오신날','09-11':'추석','09-12':'추석','09-13':'추석'},
    2031:{'01-22':'설날','01-23':'설날','01-24':'설날','05-28':'부처님오신날','09-30':'추석','10-01':'추석','10-02':'추석'},
    2032:{'02-10':'설날','02-11':'설날','02-12':'설날','05-16':'부처님오신날','09-18':'추석','09-19':'추석','09-20':'추석'}
  };
  function getHoliday(y, mIdx, d) {
    const md = `${pad(mIdx + 1)}-${pad(d)}`;
    if (FIXED_HOLIDAYS[md]) return FIXED_HOLIDAYS[md];
    if (LUNAR_HOLIDAYS[y] && LUNAR_HOLIDAYS[y][md]) return LUNAR_HOLIDAYS[y][md];
    return null;
  }

  function normalizeMemos(raw) {
    const out = {};
    Object.keys(raw || {}).forEach(k => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      const arr = raw[k];
      if (!Array.isArray(arr)) return;
      const list = arr.map(x => typeof x === 'string'
        ? { id: genId(), text: x, important: false, private: false, time: '', alarmDay: false, alarmMin: 0, image: '' }
        : { id: x.id || genId(), text: String(x.text || ''), important: !!x.important, private: !!x.private,
            time: x.time || '', alarmDay: !!x.alarmDay,
            alarmMin: x.alarmMin || ((x.alarmHours || 0) * 60), image: x.image || '' });
      if (list.length) out[k] = list;
    });
    return out;
  }

  let memos = {};
  function loadMemos() {
    let parsed = null;
    try { parsed = JSON.parse(localStorage.getItem(memKey())); } catch (e) {}
    memos = normalizeMemos(parsed);
  }
  function save() {
    try { localStorage.setItem(memKey(), JSON.stringify(memos)); updateStorage(); }
    catch (e) { showToast('저장 공간이 가득 찼습니다. 사진을 일부 삭제해 주세요.', 'err'); updateStorage(); openCleanup(); }
  }
  function migrateLegacy() {
    if (countAll(memos) > 0) return;
    const old = localStorage.getItem('calMemos');
    if (!old) return;
    try {
      const norm = normalizeMemos(JSON.parse(old));
      if (countAll(norm)) { memos = norm; save(); showToast('이전 버전의 메모를 복구했습니다.', 'ok'); }
    } catch (e) {}
  }

  /* ---------- 백업 ---------- */
  exportBtn.onclick = () => {
    if (!session) return;
    const data = { app: 'calendar-memo', team: TEAM, exportedAt: new Date().toISOString(), memos };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `메모백업_${TEAM}_${keyOf(now.getFullYear(), now.getMonth(), now.getDate())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
    showToast('백업 파일을 내보냈습니다.', 'ok');
  };
  importBtn.onclick = () => importFile.click();
  importFile.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        let obj = JSON.parse(ev.target.result);
        if (obj && obj.memos) obj = obj.memos;
        if (typeof obj !== 'object' || Array.isArray(obj)) throw 0;
        const norm = normalizeMemos(obj);
        if (!countAll(norm)) throw 0;
        const overwrite = confirm('확인을 누르면 현재 메모를 [덮어쓰기]하고,\n취소를 누르면 현재 메모에 [병합]됩니다.');
        if (overwrite) memos = norm;
        else {
          Object.keys(norm).forEach(k => {
            const exist = memos[k] || [];
            const ids = new Set(exist.map(m => m.id));
            memos[k] = exist.concat(norm[k].filter(m => !ids.has(m.id)));
          });
        }
        save(); render(); buildImportant();
        publishMemos();
        showToast('백업을 가져왔습니다.', 'ok');
      } catch (err) { alert('가져오기 실패: 올바른 백업 파일이 아닙니다.'); }
      importFile.value = '';
    };
    r.readAsText(f);
  };

  /* ---------- 계정 ---------- */
  function loadAccountsLocal(team) {
    let acc = null;
    try { acc = JSON.parse(localStorage.getItem('accounts_' + team)); } catch (e) {}
    if (!acc || !acc[ADMIN]) {
      acc = acc || {};
      if (!acc[ADMIN]) acc[ADMIN] = { pw: '1407' };
      localStorage.setItem('accounts_' + team, JSON.stringify(acc));
    }
    return acc;
  }
  function saveAccounts() {
    localStorage.setItem(accKey(), JSON.stringify(accounts));
    publishAccounts();
  }
  function renderAcctList() {
    acctList.innerHTML = '';
    Object.keys(accounts).sort().forEach(id => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="aid ${id === ADMIN ? 'admin' : ''}">${id === ADMIN ? '👑 ' : ''}${esc(id)}</span>
                      <span class="apw">••••</span>
                      <button class="eye" title="비밀번호 보기">👁</button>
                      <button class="mod" title="수정">✏️</button>
                      <button class="del" title="삭제">🗑</button>`;
      const pwEl = li.querySelector('.apw');

  newPw.addEventListener('input', () => { newPw.value = newPw.value.replace(/\D/g, ''); });
  pwInput.addEventListener('input', () => { pwInput.value = pwInput.value.replace(/\D/g, ''); });

  /* =====================================================
     ★ 실시간 공유 v2.1 : MQTT 2중 + ntfy(HTTPS) 폴백
     ===================================================== */
  const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
  const myId = Math.random().toString(36).slice(2, 10);
  let clients = [], clientTeam = null, preAccounts = null;
  let es = null, esTeam = null;
  const seenMids = new Set();
  const chunkBuf = {};

  function updateStatus() {
    const n = clients.filter(c => c.connected).length;
    shareStatus.className = 'dot' + ((n > 0 || es) ? ' on' : '');
    shareStatus.title = `MQTT ${n}/2 · ntfy ${es ? 'ON' : 'OFF'}`;
  }
  function sharedOnly(data) {
    const out = {};
    Object.keys(data || {}).forEach(k => {
      const sh = (data[k] || []).filter(m => !m.private);
      if (sh.length) out[k] = sh;
    });
    return out;
  }

  /* --- ntfy(HTTPS) 채널 --- */
  function connectNtfy(team) {
    if (esTeam === team && es) return;
    if (es) { try { es.close(); } catch (e) {} es = null; }
    esTeam = team;
    try {
      es = new EventSource('https://ntfy.sh/calmemo-' + team + '/sse');
      es.onopen = () => {
        updateStatus();
        sendShare(team, 'accounts', { type: 'sync-request' });
        sendShare(team, 'memos', { type: 'sync-request' });
      };
      es.onmessage = e => {
        try {
          const evt = JSON.parse(e.data);
          if (evt.event === 'message' && typeof evt.message === 'string') handleNtfyBody(evt.message);
        } catch (err) {}
      };
      es.onerror = () => updateStatus();
    } catch (e) { es = null; }
  }
  function ntfyPublish(team, raw, obj) {
    const url = 'https://ntfy.sh/calmemo-' + team;
    obj.kind = obj.kind || 'memos';
    let s = JSON.stringify(obj);
    if (s.length > 20000 && obj.data) {
      const stripped = JSON.parse(s);
      Object.values(stripped.data).forEach(arr => arr.forEach(x => { delete x.image; }));
      s = JSON.stringify(stripped);
    }
    if (s.length <= 3500) { fetch(url, { method: 'POST', body: s }).catch(() => {}); return; }
    const size = 3000, total = Math.ceil(s.length / size);
    if (total > 40) return;
    for (let i = 0; i < total; i++) {
      fetch(url, { method: 'POST', body: JSON.stringify({ sender: myId, mid: obj.mid, kind: obj.kind, chunk: i, total, data: s.slice(i * size, (i + 1) * size) }) }).catch(() => {});
    }
  }
  function handleNtfyBody(body) {
    let m; try { m = JSON.parse(body); } catch (e) { return; }
    if (!m || m.sender === myId) return;
    if (m.chunk !== undefined) {
      const b = chunkBuf[m.mid] || (chunkBuf[m.mid] = { parts: new Array(m.total), left: m.total });
      if (b.parts[m.chunk] === undefined) { b.parts[m.chunk] = m.data; b.left--; }
      setTimeout(() => { if (chunkBuf[m.mid] === b && b.left > 0) delete chunkBuf[m.mid]; }, 30000);
      if (b.left <= 0) {
        delete chunkBuf[m.mid];
        let full; try { full = JSON.parse(b.parts.join('')); } catch (e) { return; }
        handleShareMsg(full.kind, esTeam, full);
      }
      return;
    }
    handleShareMsg(m.kind, esTeam, m);
  }

  /* --- 통합 송신 --- */
  function sendShare(team, kind, obj) {
    obj.sender = myId;
    obj.mid = obj.mid || genId();
    obj.v = APP_VER;
    obj.kind = kind;
    const raw = JSON.stringify(obj);
    let sent = 0;
    clients.forEach(c => { if (c.connected && clientTeam === team) { c.publish(`calmemo/${team}/${kind}`, raw); sent++; } });
    ntfyPublish(team, raw, obj);
    console.log('[share] send', obj.type, '| mqtt:', sent, '| ntfy:1');
  }
  function publishMemos() {
    if (!session || clientTeam !== TEAM) return;
    const msg = { type: 'memos', data: sharedOnly(memos) };
    if (JSON.stringify(msg).length > 500000) {
      const data = JSON.parse(JSON.stringify(msg.data));
      Object.values(data).forEach(arr => arr.forEach(m => { delete m.image; }));
      msg.data = data;
      showToast('사진 데이터가 커서 텍스트만 공유되었습니다.', 'err');
    }
    sendShare(TEAM, 'memos', msg);
  }
  function publishAccounts() {
    if (!session || clientTeam !== TEAM) return;
    sendShare(TEAM, 'accounts', { type: 'accounts', data: accounts });
  }
  function requestSyncOn(c, team) {
    c.subscribe([`calmemo/${team}/accounts`, `calmemo/${team}/memos`]);
    c.publish(`calmemo/${team}/accounts`, JSON.stringify({ sender: myId, mid: genId(), type: 'sync-request', kind: 'accounts' }));
    c.publish(`calmemo/${team}/memos`, JSON.stringify({ sender: myId, mid: genId(), type: 'sync-request', kind: 'memos' }));
  }
  function requestSyncAll(team) {
    clients.forEach(c => { if (c.connected) requestSyncOn(c, team); });
    sendShare(team, 'accounts', { type: 'sync-request' });
    sendShare(team, 'memos', { type: 'sync-request' });
  }
  function connectTeam(team) {
    if (typeof mqtt === 'undefined') { connectNtfy(team); return; }
    if (clientTeam === team && clients.length) { connectNtfy(team); return; }
    clients.forEach(c => { try { c.end(true); } catch (e) {} });
    clients = [];
    clientTeam = team;
    preAccounts = null;
    if (!session) syncIndicator.textContent = '🔄 팀 계정 동기화 중...';
    BROKERS.forEach((url, idx) => {
      const c = mqtt.connect(url, { clientId: `calmemo-${myId}-${idx}`, keepalive: 30, reconnectPeriod: 5000, clean: true });
      clients.push(c);
      c.on('connect', () => { console.log('[share] MQTT connected:', url); requestSyncOn(c, team); updateStatus(); });
      c.on('reconnect', updateStatus);
      c.on('close', updateStatus);
      c.on('offline', updateStatus);
      c.on('error', () => {});
      c.on('message', onShareMessage);
    });
    connectNtfy(team);
  }
  function onShareMessage(topic, payload) {
    let msg; try { msg = JSON.parse(payload.toString()); } catch (e) { return; }
    const parts = topic.split('/');
    handleShareMsg(parts[2], parts[1], msg);
  }
  function handleShareMsg(kind, tTeam, msg) {
    if (!msg || msg.sender === myId) return;
    if (msg.mid) {
      if (seenMids.has(msg.mid)) return;
      seenMids.add(msg.mid);
      if (seenMids.size > 1000) seenMids.clear();
    }
    console.log('[share] recv', msg.type, '|', kind, '|', tTeam);

    if (kind === 'accounts') {
      if (msg.type === 'accounts' && msg.data && msg.data[ADMIN]) {
        localStorage.setItem('accounts_' + tTeam, JSON.stringify(msg.data));
        if (!session && tTeam === (teamInput.value.trim() || 'our-team')) {
          preAccounts = msg.data;
          syncIndicator.textContent = '✓ 팀 계정 동기화 완료';
        }
        if (session && tTeam === TEAM) {
          accounts = msg.data;
          if (!accounts[session.user]) doLogout('계정이 삭제되어 로그아웃되었습니다.');
        }
      } else if (msg.type === 'sync-request') {
        sendShare(tTeam, 'accounts', { type: 'accounts', data: loadAccountsLocal(tTeam) });
      }
    }
    else if (kind === 'memos') {
      if (!session || tTeam !== TEAM) return;
      if (msg.type === 'memos') {
        const before = countAll(memos);
        const merged = sharedOnly(msg.data);
        Object.keys(memos).forEach(k => {
          const priv = (memos[k] || []).filter(m => m.private);
          const imgs = {};
          (memos[k] || []).forEach(m => { if (m.image) imgs[m.id] = m.image; });
          if (priv.length) merged[k] = (merged[k] || []).concat(priv);
          (merged[k] || []).forEach(m => { if (imgs[m.id] && !m.image) m.image = imgs[m.id]; });
        });
        memos = merged;
        save(); render(); buildImportant();
        if (selectedKey && editingIdx === null) renderList();
        if (countAll(memos) > before) notify('📢 새 공유 메모가 도착했습니다.');
        else showToast('공유 메모가 업데이트되었습니다.', 'ok');
      } else if (msg.type === 'sync-request') {
        setTimeout(() => {
          publishMemos();
          if (session) sendShare(TEAM, 'accounts', { type: 'accounts', data: accounts });
        }, Math.random() * 300);
      }
    }
  }

  teamInput.addEventListener('input', () => {

    const dayName = DAY_NAMES[new Date(y, mo - 1, d).getDay()];
    const tags = [];
    if (m.important) tags.push('<span class="red">★ 중요</span>');
    if (m.private) tags.push('<span class="pur">🔒 개인</span>');
    if (m.time) tags.push(`<span>⏰ ${m.time}</span>`);
    if (m.alarmDay) tags.push('<span class="yel">⏰ 하루 전 알람</span>');
    if (m.alarmMin > 0) tags.push(`<span class="yel">⏰ ${fmtAlarm(m)} 알람</span>`);
    if (m.image) tags.push('<span>📷 사진 첨부</span>');

    savedInfo.innerHTML = `
      <div class="date">${y}년 ${mo}월 ${d}일 (${dayName})${hol ? ' · ' + hol : ''}</div>
      <div class="text">${esc(m.text).replace(/\n/g, '<br>')}</div>
      ${tags.length ? `<div class="meta">${tags.join('')}</div>` : ''}
      ${m.image ? `<img src="${m.image}" />` : ''}
    `;
    const imgEl = savedInfo.querySelector('img');
    if (imgEl) imgEl.onclick = () => openLightbox(imgEl.src);
    savedModal.classList.remove('hidden');
  }

  function addMemo() {
    const t = memoInput.value.trim();
    if (!t) return;
    const totalMin = alarmTimeChk.checked
      ? Math.max(0, (+alarmH.value || 0) * 60 + (+alarmM.value || 0))
      : 0;
    const obj = {
      id: editingIdx === null ? genId() : (memos[selectedKey][editingIdx].id || genId()),
      text: t, important: impChk.checked, private: privChk.checked,
      time: timeInput.value || '',
      alarmDay: alarmDayChk.checked,
      alarmMin: totalMin,
      image: currentImage || ''
    };
    if (editingIdx === null) (memos[selectedKey] ||= []).push(obj);
    else memos[selectedKey][editingIdx] = obj;
    afterChange();
    showSavedPopup(selectedKey, obj);
    resetEdit();
    notify('메모가 저장되었습니다.');
  }
  function afterChange() {
    save(); renderList(); render(); buildImportant();
    publishMemos();
  }

  $('#prevBtn').onclick  = () => { view.m--; if (view.m < 0)  { view.m = 11; view.y--; } render(); };
  $('#nextBtn').onclick  = () => { view.m++; if (view.m > 11) { view.m = 0;  view.y++; } render(); };
  $('#todayBtn').onclick = () => { view = { y: now.getFullYear(), m: now.getMonth() }; render(); };
  $('#refreshBtn').onclick = () => location.reload();
  yearSel.onchange  = () => { view.y = +yearSel.value; render(); };
  monthSel.onchange = () => { view.m = +monthSel.value; render(); };
  $('#jumpBtn').onclick = () => {
    if (!dateJump.value) return;
    const [y, m] = dateJump.value.split('-').map(Number);
    view = { y, m: m - 1 }; render();
  };
  $('#weekBtn').onclick = openWeekly;
  $('#weekCloseBtn').onclick = () => weekModal.classList.add('hidden');
  $('#savedCloseBtn').onclick = () => savedModal.classList.add('hidden');
  savedModal.addEventListener('click', e => { if (e.target === savedModal) savedModal.classList.add('hidden'); });
  weekModal.addEventListener('click', e => { if (e.target === weekModal) weekModal.classList.add('hidden'); });

  addBtn.onclick = addMemo;
  cancelEditBtn.onclick = resetEdit;
  $('#closeBtn').onclick = closeModal;
  memoInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addMemo(); }
  });
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTopModal(); });

  function memoDateTime(key, m) {
    const [y, mo, d] = key.split('-').map(Number);
    const [hh, mm] = (m.time || '09:00').split(':').map(Number);
    return new Date(y, mo - 1, d, hh, mm, 0);
  }
  function getAlarmTimes(key, m) {
    const dt = memoDateTime(key, m);
    const arr = [];
    if (m.alarmDay) { const d1 = new Date(dt); d1.setDate(d1.getDate() - 1); arr.push({ t: d1, type: 'day' }); }
    if (m.alarmMin > 0) arr.push({ t: new Date(dt.getTime() - m.alarmMin * 60000), type: 'min' });
    return arr;
  }
  let lastAlarmCheck = Date.now();
  function checkAlarms() {
    if (!session) return;
    const nowT = Date.now();
    const d = new Date();
    const todayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    Object.entries(memos).forEach(([k, list]) => {
      const [yy, mm, dd] = k.split('-').map(Number);
      if (new Date(yy, mm - 1, dd).getTime() < todayStart) return;
      (list || []).forEach(m => {
        getAlarmTimes(k, m).forEach(a => {
          const at = a.t.getTime();
          if (at > lastAlarmCheck && at <= nowT) {
            const label = a.type === 'day' ? '하루 전 알람' : `${fmtAlarm(m)} 알람`;
            notify(`⏰ ${label} → ${m.text} (${+mm}/${+dd} ${m.time || '09:00'})`);
          }
        });
      });
    });
    lastAlarmCheck = nowT;
  }
  function weekDates() {
    const d = new Date();
    const dow = (d.getDay() + 6) % 7;
    const mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
    return [...Array(7)].map((_, i) => { const t = new Date(mon); t.setDate(mon.getDate() + i); return t; });
  }
  function openWeekly() {
    const days = weekDates();
    const todayKey = keyOf(now.getFullYear(), now.getMonth(), now.getDate());
    let total = 0;
    weekBody.innerHTML = '';
    days.forEach(t => {
      const key = keyOf(t.getFullYear(), t.getMonth(), t.getDate());
      const list = memos[key] || [];
      if (!list.length) return;
      total += list.length;
      const hol = getHoliday(t.getFullYear(), t.getMonth(), t.getDate());
      const sec = document.createElement('div');
      sec.className = 'week-day';
      sec.innerHTML = `<h3 class="${t.getDay() === 0 ? 'sun' : ''}">${t.getMonth() + 1}/${t.getDate()} (${DAY_NAMES[t.getDay()]})
        ${hol ? `<span class="hol">${hol}</span>` : ''}${key === todayKey ? '<span class="today-tag">● 오늘</span>' : ''}</h3>`;
      const ul = document.createElement('ul');
      list.forEach(m => {
        const li = document.createElement('li');
        li.className = (m.important ? 'imp' : '') + (m.private ? ' priv' : '');
        li.textContent = memoLabel(m);
        ul.appendChild(li);
      });
      sec.appendChild(ul);
      weekBody.appendChild(sec);
    });
    if (!total) weekBody.innerHTML = '<div class="empty">이번 주 메모가 없습니다.</div>';
    weekTitle.textContent = `📋 주간 메모 정리 (${days[0].getMonth() + 1}/${days[0].getDate()} 월 ~ ${days[6].getMonth() + 1}/${days[6].getDate()} 일) · ${total}건`;
    weekModal.classList.remove('hidden');
  }
  function checkWeekly() {
    if (!session) return;
    const d = new Date();
    const hm = d.getHours() * 60 + d.getMinutes();
    const weekKey = weekDates()[0].toDateString();
    if (d.getDay() === 1 && hm >= 570 && hm < 585 && localStorage.getItem('wk_mon_' + weekKey) !== '1') {
      localStorage.setItem('wk_mon_' + weekKey, '1');
      notify('📋 주간 메모 정리 (월요일 09:30)');
      openWeekly();
    }
    if (d.getDay() === 5 && hm >= 930 && hm < 945 && localStorage.getItem('wk_fri_' + weekKey) !== '1') {
      localStorage.setItem('wk_fri_' + weekKey, '1');
      notify('📋 주간 메모 정리 (금요일 15:30)');
      openWeekly();
    }
  }
  setInterval(() => { checkAlarms(); checkWeekly(); }, 15000);

  updateBell();
  const savedSession = sessionStorage.getItem('session');
  if (savedSession) {
    try {
      session = JSON.parse(savedSession);
      TEAM = session.team;
      accounts = loadAccountsLocal(TEAM);
      if (accounts[session.user]) enterApp();
      else { session = null; sessionStorage.removeItem('session'); }
    } catch (e) { session = null; }
  }
</script>
</body>
</html>
